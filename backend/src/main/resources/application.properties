spring.application.name=backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/delivery_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rou}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET:mySuperSecretKeyForDeliveryPlatform1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

pricing.base=5.00
pricing.rate-per-kg=1.50
pricing.rate-per-km=0.50
pricing.size.small=1.0
pricing.size.medium=1.5
pricing.size.large=2.0
pricing.tier.standard=1.0
pricing.tier.express=1.5

assignment.offer-timeout-seconds=30
