<div class="drivers-management-container">
  <div class="header-section">
    <h2>Drivers Management</h2>
  </div>

  <mat-card class="drivers-card">
    <mat-card-header>
      <mat-card-title>All Drivers ({{ drivers.length }})</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="loading" class="loading-container">
        <mat-spinner diameter="36"></mat-spinner>
      </div>

      <div *ngIf="!loading" class="table-container">
        <table mat-table [dataSource]="drivers" class="drivers-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let driver">
              <strong>{{ driver.name }}</strong>
            </td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let driver">{{ driver.email }}</td>
          </ng-container>

          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Phone</th>
            <td mat-cell *matCellDef="let driver">{{ driver.phone || 'N/A' }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let driver">
              <span class="status-badge" [style.background-color]="getStatusColor(driver.status)">
                {{ driver.status }}
              </span>
            </td>
          </ng-container>

          <ng-container matColumnDef="vehicleType">
            <th mat-header-cell *matHeaderCellDef>Vehicle</th>
            <td mat-cell *matCellDef="let driver">{{ driver.vehicleType || 'N/A' }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let driver">
              <button mat-icon-button
                      (click)="activateDriver(driver.id)"
                      [disabled]="driver.status === 'ACTIVE'"
                      matTooltip="Activate">
                <mat-icon>check_circle</mat-icon>
              </button>
              <button mat-icon-button
                      (click)="suspendDriver(driver.id)"
                      [disabled]="driver.status === 'SUSPENDED'"
                      matTooltip="Suspend">
                <mat-icon>block</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <div *ngIf="drivers.length === 0" class="empty-state">
          <mat-icon>directions_car</mat-icon>
          <p>No drivers found</p>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
