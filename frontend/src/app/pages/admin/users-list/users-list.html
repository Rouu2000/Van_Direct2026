<div class="page-shell">
  <div class="page-header">
    <div>
      <h2>Users</h2>
      <p>All registered accounts on VAN DIRECT.</p>
    </div>
    <a mat-stroked-button color="primary" routerLink="/admin/dashboard">
      <mat-icon>home</mat-icon>
      Dashboard
    </a>
  </div>

  <mat-card class="panel-card">
    <mat-card-content>
      <div *ngIf="loading" class="state-block">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Loading users...</p>
      </div>

      <div *ngIf="error && !loading" class="state-block error">
        <mat-icon color="warn">error</mat-icon>
        <p>{{ error }}</p>
        <button mat-stroked-button color="primary" (click)="loadUsers()">Retry</button>
      </div>

      <div *ngIf="!loading && !error && users.length === 0" class="state-block">
        <p>No users found.</p>
      </div>

      <div *ngIf="!loading && users.length > 0" class="table-wrap">
        <table mat-table [dataSource]="users" class="users-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let u"><strong>{{ u.name }}</strong></td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let u">{{ u.email }}</td>
          </ng-container>

          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Phone</th>
            <td mat-cell *matCellDef="let u">{{ u.phone || 'N/A' }}</td>
          </ng-container>

          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let u">{{ u.role || 'CUSTOMER' }}</td>
          </ng-container>

          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let u">
              <span class="status-chip" [attr.data-status]="u.status">{{ u.status || 'ACTIVE' }}</span>
            </td>
          </ng-container>

          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef>Created</th>
            <td mat-cell *matCellDef="let u">{{ u.createdAt | date:'mediumDate' }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
