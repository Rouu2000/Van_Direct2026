<div class="auth-page">
  <mat-card class="auth-card">
    <div class="auth-brand">
      <span class="truck-icon">🚚</span>
      <span class="brand-name">VAN DIRECT</span>
    </div>

    <h2 class="auth-title">Forgot Password</h2>
    <p class="auth-subtitle">Enter your email and we'll send you a password reset link.</p>

    <div *ngIf="errorMessage" class="error-alert">
      <mat-icon>error</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="success-alert">
      <mat-icon>check_circle</mat-icon>
      <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!successMessage">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email Address</mat-label>
        <input matInput type="email" name="email" [(ngModel)]="email" required />
        <mat-icon matPrefix>email</mat-icon>
      </mat-form-field>

      <button mat-flat-button color="warn" class="submit-btn" type="submit" [disabled]="submitting">
        {{ submitting ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <p class="auth-footer">
      Remember your password? <a routerLink="/login">Back to Login</a>
    </p>
  </mat-card>
</div>
