<div class="auth-page">
  <mat-card class="auth-card">
    <div class="auth-brand"><app-brand-logo size="md" link="/"></app-brand-logo></div>
    <h2 class="auth-title">Forgot Password</h2>
    <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

    <div *ngIf="serverError"    class="vf-form-error"   role="alert">{{ serverError }}</div>
    <div *ngIf="successMessage" class="vf-form-success" role="status">{{ successMessage }}</div>

    <form #formEl [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate *ngIf="!successMessage">
      <div class="vf-field">
        <label class="vf-label" for="fp-email">Email address <span class="vf-req">*</span></label>
        <input id="fp-email" class="vf-input" type="email" formControlName="email"
               autocomplete="email" [attr.aria-invalid]="showErr(email)" aria-describedby="fp-email-err">
        <span id="fp-email-err" class="vf-error" *ngIf="showErr(email)">{{ getError(email) }}</span>
      </div>
      <button class="btn btn-primary submit-btn" type="submit" [disabled]="submitting">
        {{ submitting ? 'Sending…' : 'Send Reset Link' }}
      </button>
    </form>
    <p class="auth-footer"><a routerLink="/login">Back to Login</a></p>
  </mat-card>
</div>
