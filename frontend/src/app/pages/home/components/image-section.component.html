<section class="is-section" [class.is-reverse]="reverse">
  <div class="is-inner">
    <div class="is-media">
      <img [src]="image" [alt]="alt" width="600" height="400"
           class="is-img" loading="lazy" decoding="async">
      <div *ngIf="badge" class="is-badge">
        <span class="is-badge-dot"></span>{{ badge }}
      </div>
    </div>
    <div class="is-content">
      <h2 class="is-title">{{ title }}</h2>
      <p class="is-text">{{ text }}</p>
      <ul *ngIf="bullets.length" class="is-bullets">
        <li *ngFor="let b of bullets" class="is-bullet">
          <svg class="is-check" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          {{ b }}
        </li>
      </ul>
      <a [routerLink]="ctaRoute" class="is-cta">{{ cta }}</a>
    </div>
  </div>
</section>
