<!-- ═══════════════════════════════════════════════════════════
     VAN DIRECT — Home page (Stage B)
     SiteShell provides the mega-menu header and footer.
     This file is pure page content.
     ═══════════════════════════════════════════════════════════ -->

<!-- ── 1. HERO ───────────────────────────────────────────────── -->
<section class="hp-hero" aria-label="Hero">
  <!-- Background image with dark overlay so text is always readable -->
  <img src="images/hero.jpg" alt="" aria-hidden="true" width="1440" height="800"
       class="hp-hero-bg" fetchpriority="high" decoding="async">
  <div class="hp-hero-overlay" aria-hidden="true"></div>

  <div class="hp-hero-inner">
    <div class="hp-hero-text">
      <span class="hp-badge">🚀 Fast city delivery across Tunisia</span>
      <h1 class="hp-hero-h1">Your parcel.<br>Our promise.</h1>
      <p class="hp-hero-sub">
        From door to door, we treat every package like it's our own.
        Book in under two minutes, track live on the map.
      </p>
      <div class="hp-hero-cta">
        <a [routerLink]="heroShipRoute" class="btn btn-primary hp-btn-lg">
          {{ heroShipLabel }}
        </a>
        <a routerLink="/register" [queryParams]="{driver:'1'}" class="hp-btn-outline-white">
          Become a driver
        </a>
      </div>
    </div>

    <!-- Overlapping tab card — sits half-over hero, half below -->
    <div class="hp-hero-card">
      <app-hero-tabs></app-hero-tabs>
    </div>
  </div>
</section>

<!-- Spacer that gives the overlapping card room below the hero -->
<div class="hp-hero-card-spacer" aria-hidden="true"></div>

<!-- ── 2. QUICK ACTIONS ───────────────────────────────────────── -->
<app-quick-actions></app-quick-actions>

<!-- ── 3a. BOOK IN MINUTES ────────────────────────────────────── -->
<app-image-section
  image="images/courier.jpg"
  alt="Courier handing over a parcel at a doorstep"
  title="Book in minutes, delivered the same day"
  text="Tell us where to pick up and where to deliver. Add as many parcels as you need, pick a service tier, and confirm. A vetted driver near you gets the job instantly."
  [bullets]="['Door-to-door — no drop-off required','STANDARD or EXPRESS service tiers','Automatic driver assignment via GPS']"
  cta="Start a shipment"
  ctaRoute="/customer/shipments/new"
  [reverse]="false">
</app-image-section>

<!-- ── 3b. LIVE MAP ───────────────────────────────────────────── -->
<app-image-section
  image="images/van.jpg"
  alt="Delivery van driving through Tunis streets"
  title="Follow your parcel live on the map"
  text="The moment a driver accepts your shipment, a live GPS marker appears on your tracking page. It moves every 5 seconds — no page refresh, no guessing."
  [bullets]="['Real-time WebSocket updates','Pickup, drop-off and driver markers','In-app notification at every status change']"
  cta="Track a parcel"
  ctaRoute="/track"
  badge="Driver on the way"
  [reverse]="true">
</app-image-section>

<!-- ── 3c. MULTIPLE PARCELS ───────────────────────────────────── -->
<app-image-section
  image="images/parcels.jpg"
  alt="Multiple parcels in different sizes arranged for pickup"
  title="Multiple parcels, one booking"
  text="Bundle everything into a single shipment. Each parcel gets its own weight, size category and declared value — all in one booking, one price, one driver."
  [bullets]="['SMALL, MEDIUM and LARGE size categories','Declared value per item for records','One combined price — no per-parcel surcharge']"
  cta="Book now"
  ctaRoute="/customer/shipments/new"
  [reverse]="false">
</app-image-section>

<!-- ── 4. SERVICE CARDS ───────────────────────────────────────── -->
<app-service-cards></app-service-cards>

<!-- ── 5. DRIVE WITH US BAND ──────────────────────────────────── -->
<app-drive-band></app-drive-band>

<!-- ── 6. IMAGE CARDS + NEWS ─────────────────────────────────── -->
<app-image-cards></app-image-cards>

<!-- ── 7. TRUST STRIP ────────────────────────────────────────── -->
<app-trust-strip></app-trust-strip>
