<div class="auth-page">
  <mat-card class="auth-card">
    <div class="auth-brand"><app-brand-logo size="md" link="/"></app-brand-logo></div>
    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-subtitle">Choose a new password for your account.</p>

    <div *ngIf="serverError"    class="vf-form-error"   role="alert">{{ serverError }}</div>
    <div *ngIf="successMessage" class="vf-form-success" role="status">
      {{ successMessage }} <a routerLink="/login">Log in now →</a>
    </div>

    <form #formEl [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form" novalidate *ngIf="!successMessage">
      <div class="vf-field">
        <label class="vf-label" for="rp-pw">New password <span class="vf-req">*</span></label>
        <div class="vf-pw-wrap">
          <input id="rp-pw" class="vf-input" [type]="hidePassword?'password':'text'"
                 formControlName="newPassword" autocomplete="new-password"
                 [attr.aria-invalid]="showErr(newPassword)" aria-describedby="rp-pw-err">
          <button type="button" class="vf-pw-toggle" (click)="hidePassword=!hidePassword">
            <span class="material-icons" style="font-size:18px">{{ hidePassword?'visibility_off':'visibility' }}</span>
          </button>
        </div>
        <span id="rp-pw-err" class="vf-error" *ngIf="showErr(newPassword)">{{ getError(newPassword) }}</span>
        <span class="vf-hint">At least 8 characters with a letter and a digit.</span>
      </div>

      <div class="vf-field">
        <label class="vf-label" for="rp-cpw">Confirm password <span class="vf-req">*</span></label>
        <input id="rp-cpw" class="vf-input" [type]="hidePassword?'password':'text'"
               formControlName="confirmPassword" autocomplete="new-password"
               [attr.aria-invalid]="showErr(confirmPassword) || showMismatch()" aria-describedby="rp-cpw-err">
        <span id="rp-cpw-err" class="vf-error" *ngIf="showErr(confirmPassword) || showMismatch()">
          {{ form.errors?.['passwordsMismatch'] || getError(confirmPassword) }}
        </span>
      </div>

      <button class="btn btn-primary submit-btn" type="submit" [disabled]="submitting">
        {{ submitting ? 'Resetting…' : 'Reset Password' }}
      </button>
    </form>
    <p class="auth-footer" *ngIf="!successMessage"><a routerLink="/login">Back to Login</a></p>
  </mat-card>
</div>
