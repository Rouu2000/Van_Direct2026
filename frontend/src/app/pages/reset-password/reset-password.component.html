<div class="auth-page">
  <mat-card class="auth-card">
    <div class="auth-brand">
      <span class="truck-icon">🚚</span>
      <span class="brand-name">VAN DIRECT</span>
    </div>

    <h2 class="auth-title">Reset Password</h2>
    <p class="auth-subtitle">Choose a new password for your account</p>

    <div *ngIf="errorMessage" class="error-alert">
      <mat-icon>error</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <div *ngIf="successMessage" class="success-alert">
      <mat-icon>check_circle</mat-icon>
      <span>{{ successMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form" *ngIf="!successMessage">
      <mat-form-field appearance="outline" class="full-width" *ngIf="!token">
        <mat-label>Reset Token</mat-label>
        <input matInput type="text" name="token" [(ngModel)]="token" required />
        <mat-icon matPrefix>key</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>New Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" name="newPassword" [(ngModel)]="newPassword" required />
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" name="confirmPassword" [(ngModel)]="confirmPassword" required />
        <mat-icon matPrefix>lock_outline</mat-icon>
      </mat-form-field>

      <button mat-flat-button color="warn" class="submit-btn" type="submit" [disabled]="submitting">
        {{ submitting ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <p class="auth-footer" *ngIf="successMessage">
      <a mat-flat-button color="primary" routerLink="/login" class="login-redirect-btn">Proceed to Login</a>
    </p>

    <p class="auth-footer" *ngIf="!successMessage">
      Remembered your password? <a routerLink="/login">Back to Login</a>
    </p>
  </mat-card>
</div>
